  <text x="40" y="548" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 結論ファースト: 4.0 / 5 — 結論を先に述べてから背景を補足できています。</text>
  <text x="40" y="570" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 技術選定のトレードオフ: 4.2 / 5 — レイテンシと整合性の比較が明確です。</text>
  <text x="40" y="592" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">• 音読練習リライト: 「まず結論から申し上げますと、ドメイン境界を基準に…」</text>
